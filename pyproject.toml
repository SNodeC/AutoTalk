[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autotalk"
version = "0.2.0"
description = "Turn PDF slides into a timed presentation in your own voice"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6==6.11.2", "numpy==2.3.5", "av==18.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller==6.22.3"]

[project.scripts]
autotalk = "autotalk.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autotalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["audio_device: requires an available physical or virtual system audio output"]

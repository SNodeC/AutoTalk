 <div class="at-review"><div><strong>AutoTalk · UI proposal</strong><div class="at-subtle">Interactive mockups · Linux / Breeze</div></div><label>Preview <select id="at-scene" aria-label="Preview screen"></select></label></div>

<script>
(()=>{
 const root=document.getElementById('autotalk-proposal');
 const q=s=>root.querySelector(s);

 const btn=(text,action,primary=false,icon='')=>`<button type="button" class="at-btn ${primary?'at-primary':''}" data-action="${action}">${icon?ic(icon):''}${text}</button>`;

 const field=(label,value,type='text',id='')=>`<label class="at-field"><span>${label}</span><input type="${type}" value="${value}" ${id?`id="${id}"`:''}></label>`;
 const check=(text,checked=false,id='')=>`<label class="at-check"><input type="checkbox" ${checked?'checked':''} ${id?`id="${id}"`:''}>${text}</label>`;
 const radio=(name,value,title,description,chosen=false)=>`<label class="at-radio-box"><span class="at-check"><input type="radio" name="${name}" value="${value}" ${chosen?'checked':''}><span>${title}</span></span><span class="at-subtle">${description}</span></label>`;
 const note=text=>`<div class="at-note">${text}</div>`;
 const titles=['Local AI on stage','Why automate a talk?','One deck. Three stages.','Make the first minute fast','Keep one voice throughout','From slides to a live demo','Designed for the desktop','What to take away'];
 const narration=[
  'Welcome. Today we will look at how a slide deck becomes a complete spoken presentation. We will focus on a practical question: how do we make this useful on a normal desktop?',
  'The slides are ready, but the talk is not. Writing the narration, keeping to time, and rehearsing the delivery all require work. An assistant can help with that preparation while leaving the speaker in control.',
  'Think of the presentation as three connected stages. First, we read the slides and decide what the audience needs to hear. Then, we turn that narration into speech. Finally, we play the audio and advance the slides together. Each stage has a clear job. This makes it easier to review the result before presenting, or to start early while the remaining slides are still being prepared.',
  'The first minute matters. Realtime mode prepares a small lead of audio, then begins the presentation while the next slides are generated. The presenter can always see whether enough audio is ready ahead.',
  'A stable voice is more than a speaker name. The delivery instruction should stay consistent across the talk. A slide can still have a deliberate change of tone, but that should be a conscious choice.',
  'Let us see this in practice. I will pause the narration and switch to a live demonstration. The screen recording will continue so that the audience can follow the complete example.',
  'A desktop application should feel familiar. The platform supplies the widget style, colors, fonts, and file dialogs. The application concentrates on the presentation workflow.',
  'The key idea is simple: prepare only what you need, keep the delivery consistent, and make the presentation easy to control. Thank you. I am happy to take questions.'
 ];
 const state={scene:'prepared',mode:'Prepared',slide:2,language:'English',duration:'12',style:'Professional',voice:'Vivian',voiceSource:'Predefined voice',record:false,recordType:'slides',dialog:'',tab:'',menu:'',playing:true,previewAudio:false,theme:'Light',density:'compact',inspector:true};
 const scenes=[['Workspaces',[['prepared','Prepared · review & edit'],['quick','Quick · PDF to presentation'],['realtime','Realtime · preparing first slides'],['playing','Realtime · presenting'],['resume','Fullscreen exited · resume'],['empty','New talk · welcome'],['setup','First launch · automatic setup'],['buffering','Realtime · waiting for audio']]],['Talk settings',[['talk-general','Duration, language & mode'],['talk-conference','Conference & audience'],['talk-voice','Voice & cloning'],['talk-delivery','Delivery & expression'],['talk-recording','Recording & live demos']]],['Application preferences',[['prefs-general','System appearance & defaults'],['prefs-codex','Codex model & reasoning'],['prefs-speech','Speech engine & sampling']]],['Presentation & media',[['presenter','Presenter view'],['demo','Live demo · recording continues'],['voices','Voice library'],['export','Export & recordings'],['audience','Audience fullscreen display'],['capture','System screen-recording chooser'],['export-progress','Video export · progress'],['audio','System audio selector'],['pdf','Native PDF chooser']]],['Opened menus',[['menu-File','File menu'],['menu-Edit','Edit menu'],['menu-View','View menu'],['menu-Talk','Talk menu'],['menu-Presentation','Presentation menu'],['menu-Settings','Settings menu'],['menu-Help','Help menu']]]];

 function menus(){q('#at-menus').innerHTML=Object.entries(menuItems).map(([name,items])=>`<div class="at-menu-anchor"><button class="at-menu-trigger" data-menu="${name}" aria-expanded="${state.menu===name}" aria-haspopup="true">${name}</button>${state.menu===name?`<div class="at-menu" aria-label="${name} menu">${items.map(item=>item?`<button data-action="${item[2]}" ${(item[2]==='continue'&&state.scene!=='resume')||(['pause','leave'].includes(item[2])&&!['playing','presenter','demo','buffering'].includes(state.scene))?'disabled':''}><span>${item[0]}</span><kbd>${item[1]}</kbd></button>`:'<hr>').join('')}</div>`:''}</div>`).join('');}
 function deck(i=state.slide){return `<div class="at-deck" role="img" aria-label="Slide ${i+1}: ${titles[i]}"><div><div class="at-eyebrow">OPEN SYSTEMS SUMMIT · SAMPLE DECK</div><h2>${titles[i]}</h2>${i===2?'<div class="at-pipeline"><span>Understand<br>the slides</span>→<span>Create<br>the speech</span>→<span>Present<br>in sync</span></div>':`<p class="at-deck-text">${['A practical guide to presentations powered by local speech.','Less repetitive preparation. More control over your message.','','Prepare ahead. Start early. Keep the audience informed.','The same voice, with a deliberate and consistent delivery.','Pause the narration. Show the real application. Continue the talk.','Linux · Windows · macOS','One clear workflow, from PDF to presentation.'][i]}</p>`}</div><div class="at-deck-footer"><span>LOCAL AI ON STAGE</span><span>${String(i+1).padStart(2,'0')} / 08</span></div></div>`;}
 function wave(){return `<div class="at-wave" aria-label="Audio waveform">${[7,12,8,18,25,14,21,10,6,18,26,20,9,16,25,12,8,22,15,27,9,17,12,8,19,24,15,9,18,10].map(h=>`<span style="height:${h}px"></span>`).join('')}</div>`;}
 function toolbar(){if(['presenter','playing','demo','buffering'].includes(state.scene)){q('#at-toolbar').innerHTML=`<span class="at-inline">${ic('presentation')} Presenter controls</span><span class="at-space"></span><span class="at-subtle">${state.mode} · ${state.language} · ${state.duration} min</span>`;return;}const isQuick=state.scene==='quick'||state.scene==='empty';q('#at-toolbar').innerHTML=`${btn('New','empty',false,'file-plus')}${btn('Open','open',false,'folder-open')}${!isQuick?btn('Save','save',false,'save'):''}<span class="at-space"></span>${!isQuick?`<label>Mode <select id="at-mode"><option ${state.mode==='Prepared'?'selected':''}>Prepared</option><option ${state.mode==='Quick'?'selected':''}>Quick</option><option ${state.mode==='Realtime'?'selected':''}>Realtime</option></select></label>${btn('Talk settings','talk-general',false,'settings-2')}${state.scene==='resume'?btn('Continue','continue',true,'play'):state.mode==='Realtime'?btn(state.scene==='realtime'?'Start when ready':'Start','realtime-start',true,'play'):btn('Start','start',true,'play')}`:''}`;}
 function workspace(){const realtime=state.mode==='Realtime';const waiting=state.scene==='realtime';const resumed=state.scene==='resume';const ready=realtime?2:8;
 return `<div class="at-context"><span><strong>Local AI on stage</strong><span class="at-subtle">　${state.duration} min · ${state.language} · ${state.voice}</span></span>${btn('Export / recordings','export',false,'video')}</div>${resumed?note('Presentation paused at slide 3 · 03:24. Continue from this position, or start again from the beginning.'):''}<div class="at-workspace"><aside class="at-slides"><div class="at-panel-heading">Slides <span class="at-subtle">8</span></div><div class="at-slide-list">${titles.map((t,i)=>`<button class="at-slide-item" data-slide="${i}" aria-current="${i===state.slide}"><span class="at-slide-number">${i+1}</span><span><span class="at-thumb">${t}<small>${i+1}</small></span><span class="at-slide-state"><span class="${i<ready?'at-good':i===ready?'at-warn':'at-subtle'}">${i<ready?'✓ Ready':i===ready&&realtime?'◌ Creating':'Queued'}</span><span>${['1:12','1:34','1:22','1:46','1:29','1:51','1:25','1:17'][i]}</span></span></button>`).join('')}</div></aside><section class="at-center">${deck()}<div class="at-editor-head"><strong>Narration · slide ${state.slide+1}</strong><span class="at-subtle">${state.language} · target 1:22</span></div><textarea class="at-narration" id="at-narration" aria-label="Narration for selected slide">${narration[state.slide]}</textarea><div class="at-editor-head"><span class="at-subtle" id="at-edit-status">${realtime&&state.slide>=ready?'Narration ready · audio queued':'Narration and audio are up to date'}</span>${btn('Regenerate…','regenerate',false,'refresh-cw')}</div><div class="at-audio">${btn(state.previewAudio?'Stop preview':'Preview','preview',false,state.previewAudio?'square':'play')}${wave()}<span class="at-subtle">0:00 / 1:22</span></div></section><aside class="at-inspector"><div class="at-panel-heading">Slide inspector <span class="at-subtle">${state.slide+1} / 8</span></div><div class="at-inspector-content">${field('Target duration','82','number')}${check('Use talk delivery',true,'at-inherit')}<div id="at-delivery-summary" class="at-subtle">${state.style}<br>Steady pace · restrained expression<br>Voice: ${state.voice}</div><div id="at-local-delivery" hidden>${select('Slide delivery',['Professional','Energetic','Understated','Playful'],'Professional')}</div>${select('After this slide',['Advance automatically','Pause for live demo','Wait for presenter'],'Advance automatically')}${check('Include in presentation',true)}${note('Changes here apply only to this slide. Talk settings control the whole presentation.')}${btn('Talk settings…','talk-delivery')}</div></aside></div><div class="at-progress-section"><div class="at-inline"><strong>${waiting?'◌ Preparing slide 3 audio…':realtime?'Preparing ahead · slide 3 of 8':'✓ Talk prepared'}</strong><span class="at-space"></span><span>${ready} / 8 slides ready</span></div><div class="at-progress" role="progressbar" aria-label="Slides prepared" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${ready}"><span style="width:${ready/8*100}%"></span></div><div class="at-inline"><span class="at-subtle">${waiting?'First 2 slides ready · presentation will begin automatically':realtime?'Playback can start with the first 2 slides':'Estimated talk: 11:56 · requested: 12:00'}</span><span class="at-space"></span>${btn(waiting?'Cancel preparation':'Preparation details','details')}${!realtime?btn('Prepare full talk','prepare'):''}</div></div>`;}
 function empty(quick){return `<div class="at-empty"><div class="at-inline">${ic('presentation')}<span class="at-subtle">${quick?'QUICK PRESENTATION':'AUTOTALK'}</span></div><h2>${quick?'Choose a PDF. Start your talk.':'Turn your slides into a talk.'}</h2><p class="at-subtle">${quick?'AutoTalk writes the narration, prepares the audio, and starts presenting.':'Open a saved talk or create a new one from a PDF slide deck.'}</p><div class="at-drop">${ic('file-text')}<strong>${quick?'local-ai-on-stage.pdf':'Drop a PDF slide deck here'}</strong><span class="at-subtle">${quick?'8 slides · 2.4 MB':'PDF files · slides stay in their original order'}</span>${btn(quick?'Choose another PDF…':'Choose PDF…','pdf',false,'folder-open')}</div>${quick?`<div class="at-columns">${field('Talk length (minutes)',state.duration,'number','at-quick-duration')}${select('Language',['English','German','French','Spanish','Japanese'],state.language,'at-quick-language')}</div>${note('Default voice · no conference context · automatic slide advance')}${check('Record presentation',state.record,'at-quick-record')}<div class="at-inline">${btn('Start presentation','quick-start',true,'play')}${btn('More control: Prepared mode','prepared')}</div>`:`<div class="at-inline">${btn('Create a talk…','talk-general',true,'file-plus')}${btn('Open saved talk…','open')}</div><hr><h4>Recent talks</h4>${btn('Local AI on stage · 12 min · English','prepared')}${btn('Quick start with a PDF…','quick')}`}</div>`;}
 function presenter(demo=false){const waiting=state.scene==='buffering';return `<div class="at-presenter"><div class="at-presenter-top"><div><span class="at-subtle">${demo?'LIVE DEMO · NARRATION PAUSED':'PRESENTER VIEW · REALTIME'}</span><h3>${demo?'Your desktop is being recorded':waiting?'Waiting for the next slide’s audio':'Local AI on stage'}</h3></div><div><span class="at-clock">03:24</span><span class="at-subtle"> / 12:00</span></div></div><div class="at-inline"><span class="at-good">✓ Audience display: HDMI · 2560 × 1440</span><span class="at-space"></span>${state.record||demo?'<span class="at-recording">Screen recording · 03:24</span>':'<span class="at-subtle">Recording off</span>'}</div>${demo?note('Screen recording continues while you use another application. Resume narration when your demonstration is finished.'):waiting?note('The current slide stays visible. Playback will resume when the next audio is ready. You can pause or end the presentation at any time.'):''}<div class="at-presenter-slides"><div>${deck(demo?5:state.slide)}</div><div class="at-next"><span class="at-subtle">UP NEXT · SLIDE ${Math.min(8,state.slide+2)}</span><h3>${titles[Math.min(7,state.slide+1)]}</h3><span class="${waiting?'at-warn':'at-good'}">${waiting?'◌ Creating audio…':'✓ Audio ready · 1:46'}</span><hr><span>Prepared ahead</span><div class="at-progress"><span style="width:62.5%"></span></div><span class="at-subtle">${waiting?'3 / 8 slides ready<br>Slide 4 audio is being created':'5 / 8 slides ready<br>Slide 6 audio is being created'}</span></div></div><div class="at-presenter-copy"><span class="at-subtle">CURRENT NARRATION</span><p>Think of the presentation as three connected stages. <mark>First, we read the slides and decide what the audience needs to hear.</mark> Then, we turn that narration into speech.</p></div><div class="at-inline">${btn('Previous','previous',false,'skip-back')}${btn(demo?'Resume narration':state.playing?'Pause narration':'Resume narration','pause',true,state.playing&&!demo?'pause':'play')}${btn('Next slide','next',false,'skip-forward')}<span class="at-space"></span>${btn(demo?'Return to slides':'Live demo…',demo?'presenter':'demo',false,'monitor')}</div><div class="at-inline">${btn('Leave fullscreen','leave')}${btn('End presentation…','end')}<span class="at-space"></span>${btn('Audio output…','audio',false,'volume-2')}</div></div>`;}
 const talkTabs=[['general','General'],['conference','Conference'],['voice','Voice'],['delivery','Delivery'],['recording','Presentation & recording']];
 const prefTabs=[['general','General'],['codex','Codex'],['speech','Speech engine']];
 function talkContent(tab){
 if(tab==='general')return `<h3>Talk settings</h3><p class="at-subtle">Saved with “Local AI on stage”.</p>${field('Title','Local AI on stage')}<div class="at-columns">${field('Talk length (minutes)',state.duration,'number','at-duration')}${select('Language',['English','German','French','Spanish','Japanese'],state.language,'at-language')}</div><h4>Preparation mode</h4>${radio('mode','Prepared','Prepared','Generate the full talk, review it, then present.',state.mode==='Prepared')}${radio('mode','Quick','Quick','Use the default voice without conference context. Start handles everything.',state.mode==='Quick')}${radio('mode','Realtime','Realtime','Prepare the first slides, then present while the rest is generated.',state.mode==='Realtime')}`;
 if(tab==='conference')return `<h3>Conference & audience</h3><p class="at-subtle">Give the narrator a purpose and an audience.</p><div class="at-inline"><label class="at-check"><input type="radio" name="context-source" value="url" checked>Conference website</label><label class="at-check"><input type="radio" name="context-source" value="text">My explanation</label></div><div id="at-url-context">${field('Conference URL','https://conference.example/program')}<div class="at-inline" style="margin-top:8px">${btn('Read website','read-context',false,'globe')}<span class="at-subtle">Example conference · preview content</span></div></div><label class="at-field"><span>Scope to use for this talk</span><textarea id="at-context-text">Open source desktop applications, local AI, practical engineering, and responsible use of automation. Prefer reproducible examples over product marketing.</textarea></label><div class="at-columns">${select('Audience',['Developers','Researchers','General audience','Mixed audience'],'Developers')}${select('Technical depth',['Introductory','Intermediate','Advanced'],'Intermediate')}</div>${field('Main message','Local speech can make presentations easier to prepare.')}${note('Review and edit the scope before using it. The slides remain the factual basis for the talk.')}`;
 if(tab==='voice')return `<h3>Voice</h3>${select('Voice source',['Predefined voice','My cloned voice','Designed voice'],state.voiceSource,'at-voice-source')}<div id="at-voice-fields">${voiceFields()}</div>${btn('Open voice library…','voices',false,'library')}<label class="at-field"><span>Preview text</span><input value="Welcome. Today we will explore local AI on the desktop."></label><div class="at-inline">${btn('Preview voice','preview-voice',false,'volume-2')}<span class="at-subtle">Uses the selected talk language: ${state.language}</span></div>`;
 if(tab==='delivery')return `<h3>Delivery & expression</h3>${select('Talk style',['Professional','Conversational','Energetic','Understated','Playful','Academic','Storytelling'],state.style,'at-style')}<label class="at-field"><span>Shared delivery instruction</span><textarea>Use a steady pace, restrained expression, and consistent delivery throughout the talk. Sound clear, approachable, and confident. Keep emphasis deliberate.</textarea></label><div class="at-columns">${select('Pace',['Slow','Steady','Brisk'],'Steady')}${select('Expression',['Restrained','Natural','Expressive'],'Restrained')}</div><details><summary>Additional voice direction</summary><div class="at-columns">${select('Pitch',['Voice default','Lower','Higher'],'Voice default')}${select('Accent / dialect',['Voice default','Specify in instruction'],'Voice default')}</div><label class="at-field" style="margin-top:12px"><span>Gradual changes, pauses & paralanguage</span><textarea placeholder="For example: gently build energy toward the conclusion; a brief pause after questions."></textarea></label></details>${note('Delivery directions are guidance. Controls depend on the selected speech model. Deliberate slide overrides are preserved.')}`;
 return `<h3>Presentation & recording</h3>${select('Fullscreen display',['HDMI · 2560 × 1440','Built-in display · 1920 × 1080'],'HDMI · 2560 × 1440')}<div class="at-field"><span>Audio destination</span><div class="at-inline"><span>Managed by the system</span>${btn('System audio selector…','audio',false,'volume-2')}</div></div><hr>${check('Record presentation',state.record,'at-record')}<div id="at-record-options" ${state.record?'':'hidden'}>${radio('capture','slides','Slide video + narration','A clean video of the slides. Export after preparation or presentation.',state.recordType==='slides')}${radio('capture','screen','Screen recording + audio','Capture the chosen screen, including manual live demos.',state.recordType==='screen')}<div class="at-columns" style="margin-top:12px">${select('Video quality',['1080p · 30 fps','720p · 30 fps','Native display resolution'],'1080p · 30 fps')}<div id="at-capture-audio">${select('Capture audio',state.recordType==='slides'?['AutoTalk narration']:['System audio','System audio + microphone'],state.recordType==='slides'?'AutoTalk narration':'System audio')}</div></div><div class="at-field" style="margin-top:12px"><span>Save recordings to</span><div class="at-inline"><span class="at-subtle">Talk folder / Recordings</span>${btn('Choose…','record-folder')}</div></div></div>${note('Screen capture requests a display through the system chooser when recording starts. A visible indicator stays on while recording.')}`;
 }
 function voiceFields(){if(state.voiceSource==='My cloned voice')return `<div class="at-field"><span>Saved voice</span><select><option>My voice · English</option><option>My voice · German</option></select></div><div class="at-inline" style="margin-top:12px">${btn('Record reference…','reference')}${btn('Import recording…','reference')}</div><p class="at-subtle" style="margin-top:10px">Qwen3-TTS 1.7B · Base<br>The same accepted reference and exact transcript are reused throughout the talk.</p>`;if(state.voiceSource==='Designed voice')return `<label class="at-field"><span>Describe the voice</span><textarea>A mature, warm voice with a calm presence, clear articulation, and a lightly conversational delivery.</textarea></label><div class="at-columns" style="margin-top:12px">${select('Perceived age',['Unspecified','Young adult','Middle-aged','Older adult'],'Middle-aged')}${select('Vocal character',['Warm','Bright','Soft','Deep','Neutral'],'Warm')}</div><div class="at-inline" style="margin-top:12px">${btn('Generate audition','preview-voice')}${btn('Save accepted voice…','save-voice')}</div><p class="at-subtle" style="margin-top:8px">Qwen3-TTS 1.7B · VoiceDesign → saved reference voice</p>`;return `${select('Speaker',['Vivian','Ryan','Serena','Aiden'],state.voice,'at-speaker')}<p class="at-subtle" style="margin-top:8px">Qwen3-TTS 1.7B · CustomVoice<br>Preview in ${state.language} before preparing the talk.</p>`;}
 function prefContent(tab){if(tab==='general')return `<h3>Application preferences</h3><p class="at-subtle">Defaults for new talks. Existing talks keep their saved settings.</p><h4>Appearance</h4><div class="at-radio-box"><span>Follow platform settings</span><span class="at-subtle" style="padding-left:0">Widget style: Breeze<br>Colors: system palette · Fonts: system fonts<br>File dialogs: native</span></div><div class="at-columns">${select('Default talk language',['English','German','French','Spanish','Japanese'],'English')}${select('Default mode',['Prepared','Quick','Realtime'],'Prepared')}</div>${check('Reopen the last talk on launch',true)}${check('Confirm before replacing generated narration',true)}<div class="at-field"><span>Default talk location</span><div class="at-inline"><span>Documents / AutoTalk</span>${btn('Choose…','record-folder')}</div></div>${note('The appearance shown here is a Breeze preview. The real application uses the current platform’s controls and settings.')}`;
 if(tab==='codex')return `<h3>Codex</h3><div class="at-inline"><span class="at-good">✓ Connected to Codex</span><span class="at-space"></span>${btn('Account…','account')}</div>${select('Default model',['Account default','Choose from available Codex models…'],'Account default')}${select('Reasoning effort',['Model default','Low','Medium','High','Extra high'],'Medium')}<p class="at-subtle">Model choices and supported reasoning levels come from the connected Codex account.</p><hr><h4>Generation defaults</h4>${check('Use slide images as well as extracted text',true)}${check('Use reviewed conference context when provided',true)}${note('These defaults apply to new generation requests. Higher reasoning effort can increase preparation time.')}`;
 return `<h3>Speech engine</h3><div class="at-inline"><span class="at-good">✓ Qwen3-TTS ready</span><span class="at-space"></span>${btn('Runtime details…','diagnostics')}</div><div class="at-columns">${select('Model size',['1.7B · preferred','0.6B · lighter option'],'1.7B · preferred')}<div class="at-field"><span>Processing device</span><div class="at-radio-box">Automatic · NVIDIA GPU</div></div></div><p class="at-subtle">Model variant follows the voice source: CustomVoice, Base, or VoiceDesign. Required components are prepared automatically.</p>${select('Audio output quality',['Native synthesis rate','48 kHz export · resampled'],'Native synthesis rate')}<p class="at-subtle">Resampling changes the output format; it does not add voice detail.</p><details open><summary>Advanced synthesis · experimental</summary><div class="at-columns">${field('Main-generator temperature','0.7','number')}${field('Acoustic-generator temperature','0.7','number')}</div><div class="at-columns" style="margin-top:12px">${select('Sampling',['Model defaults','Controlled experiment'],'Model defaults')}${field('Repeatable test seed','42','number')}</div><p class="at-subtle" style="margin-top:10px">Example values for the proposed controls. Compare both generators; a fixed seed does not guarantee continuity between passages.</p></details>`;
 }
 function modal(group,tab){state.dialog=group;state.tab=tab;state.menu='';menus();const isTalk=group==='talk';const tabs=isTalk?talkTabs:prefTabs;q('#at-modal').hidden=false;q('#at-modal').innerHTML=`<section class="at-dialog" role="dialog" aria-modal="true" aria-label="${isTalk?'Talk settings':'Preferences'}"><div class="at-dialog-head">${isTalk?'Talk settings — Local AI on stage':'Configure AutoTalk'}<button class="at-close" aria-label="Close dialog" data-action="close">×</button></div><div class="at-dialog-layout"><nav class="at-dialog-nav" aria-label="${isTalk?'Talk settings sections':'Preferences sections'}">${tabs.map(([id,t])=>`<button aria-selected="${id===tab}" data-action="${group}-${id}">${t}</button>`).join('')}</nav><div class="at-dialog-content">${isTalk?talkContent(tab):prefContent(tab)}</div></div><div class="at-dialog-actions">${btn('Cancel','close')}${btn(isTalk?'Save settings':'Apply','apply',true)}</div></section>`;finishRender();}

 function pdf(){simple('Choose slide deck',`<div class="at-inline">${btn('↑','pdf-parent')}<span>Home / Documents / Presentations</span></div><table class="at-table"><thead><tr><th>Name</th><th>Type</th><th>Size</th></tr></thead><tbody><tr><td>${btn('Conferences','pdf-folder',false,'folder')}</td><td>Folder</td><td>—</td></tr><tr><td>${btn('Rehearsals','pdf-folder',false,'folder')}</td><td>Folder</td><td>—</td></tr><tr class="at-selected"><td>local-ai-on-stage.pdf</td><td>PDF document</td><td>2.4 MB</td></tr></tbody></table>${field('File name','local-ai-on-stage.pdf')}${select('File type',['PDF slides (*.pdf)'],'PDF slides (*.pdf)')}`,btn('Cancel','close')+btn('Open PDF','pdf-selected',true));}
 function audio(){simple('Audio Volume — System Settings',`<h3>Playback devices</h3>${radio('output','speakers','Built-in Audio · Speakers','Active output',true)}${radio('output','hdmi','HDMI / DisplayPort','External display')}${radio('output','headset','USB Headset','Connected')}<label class="at-field"><span>Volume · 75%</span><input type="range" value="75" aria-label="Output volume"></label><hr><h4>Applications</h4><div class="at-inline">${ic('volume-2')}<span>AutoTalk</span><span class="at-space"></span><select style="width:auto" aria-label="AutoTalk output"><option>Built-in Audio · Speakers</option><option>HDMI / DisplayPort</option><option>USB Headset</option></select></div>${note('System-owned dialog preview. AutoTalk opens the platform audio selector; it does not maintain a competing device list.')}`);}
 function setup(){simple('Preparing local speech',`<h3>AutoTalk is getting ready</h3><p>Setup runs automatically on this computer.</p><table class="at-table"><tr><td>Check hardware</td><td class="at-good">✓ NVIDIA GPU detected</td></tr><tr><td>Prepare speech environment</td><td class="at-good">✓ Ready</td></tr><tr><td>Download selected voice model</td><td>Downloading · 64%</td></tr><tr><td>Load speech engine</td><td class="at-subtle">Waiting</td></tr></table><div class="at-progress" role="progressbar" aria-label="Model download" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><span style="width:64%"></span></div>${note('You can work on the slides while setup finishes. Downloaded components are reused on later launches.')}`,btn('Continue editing','close')+btn('Preview ready state','setup-finished',true));}
 function capture(){simple('Share a screen — System chooser',`<h3>Choose what AutoTalk records</h3>${radio('screen','external','External display · HDMI','Entire display, including any live demo you open there.',true)}${radio('screen','builtin','Built-in display','Entire laptop display.')}<div class="at-columns">${check('Include system audio',true)}${check('Include microphone',false)}</div>${note('System-owned permission dialog preview. Available choices depend on the desktop and capture backend.')}`,btn('Cancel','close')+btn('Share selected screen','capture-selected',true));}
 function exportProgress(){simple('Exporting slide video',`<h3>Local AI on stage.mp4</h3><p>Rendering slide 5 of 8 · 1080p · narration included</p><div class="at-progress" role="progressbar" aria-label="Video export" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58"><span style="width:58%"></span></div><div class="at-inline"><span>58%</span><span class="at-space"></span><span class="at-subtle">Talk folder / Recordings</span></div>${note('The completed file appears in Export & recordings. You can continue editing while it is exported.')}`,btn('Cancel export','close')+btn('Continue editing','close'));}
 function render(){for(const sel of ['.at-title','#at-menus','#at-toolbar','.at-status'])q(sel).hidden=state.scene==='audience';q('#at-modal').hidden=true;state.dialog='';q('#at-title-text').textContent=state.scene==='empty'?'AutoTalk':'Local AI on stage.autotalk — AutoTalk';toolbar();menus();q('#at-page').innerHTML=state.scene==='quick'?empty(true):state.scene==='empty'?empty(false):state.scene==='audience'?`<div style="padding:18px">${deck()}<p class="at-subtle" style="padding-top:12px">Audience display · controls remain on the presenter display</p></div>`:['presenter','playing','demo','buffering'].includes(state.scene)?presenter(state.scene==='demo'):workspace();q('#at-status-left').textContent=`All changes saved · 8 slides · ${state.language}`;finishRender();}
 function finishRender(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});resize();}
 function resize(){const dialog=q('#at-modal .at-dialog');q('#at-stage').style.minHeight=!q('#at-modal').hidden&&dialog?Math.max(665,dialog.offsetHeight+56)+'px':'665px';root.querySelectorAll('.at-menu').forEach(m=>{m.style.left='0px';const b=m.getBoundingClientRect(),r=root.getBoundingClientRect();if(b.right>r.right)m.style.left=(r.right-b.right-6)+'px';});}
 const observer=new ResizeObserver(resize);observer.observe(root);
 function toast(text){q('#at-toast').textContent=text;q('#at-toast').hidden=false;}
 function choose(scene){state.menu='';state.dialog='';q('#at-toast').hidden=true;state.scene=scene;state.previewAudio=false;if(['prepared','quick','empty','realtime','playing','resume','presenter','demo','buffering','audience'].includes(scene)){if(['realtime','playing','presenter','buffering'].includes(scene))state.mode='Realtime';if(scene==='prepared')state.mode='Prepared';if(scene==='quick')state.mode='Quick';if(scene==='realtime')state.slide=0;if(scene==='demo'){state.slide=5;state.record=true;state.recordType='screen';state.playing=false;}render();}else{state.scene='prepared';render();if(scene.startsWith('talk-')){if(scene==='talk-recording'){state.record=true;state.recordType='screen';}modal('talk',scene.slice(5));}else if(scene.startsWith('prefs-'))modal('prefs',scene.slice(6));else if(scene.startsWith('menu-')){state.menu=scene.slice(5);menus();finishRender();}else if(scene==='voices')voiceLibrary();else if(scene==='export')exports();else if(scene==='pdf')pdf();else if(scene==='audio')audio();else if(scene==='setup')setup();else if(scene==='capture')capture();else if(scene==='export-progress')exportProgress();}q('#at-scene').value=scene;}
 function close(){state.dialog='';q('#at-modal').hidden=true;resize();}
 function action(a){state.menu='';menus();if(a.startsWith('talk-'))return modal('talk',a.slice(5));if(a.startsWith('prefs-'))return modal('prefs',a.slice(6));if(['prepared','quick','empty','realtime','playing','resume','presenter','demo','voices','export','audio','pdf'].includes(a))return choose(a);
 if(a==='close')return close();
 if(a==='apply'){const lang=q('#at-language'),duration=q('#at-duration'),mode=q('input[name=mode]:checked'),style=q('#at-style'),speaker=q('#at-speaker');if(lang)state.language=lang.value;if(duration)state.duration=duration.value;if(mode)state.mode=mode.value;if(style)state.style=style.value;if(speaker)state.voice=speaker.value;render();return toast('Settings saved in this preview. Regenerate affected audio to apply voice or delivery changes.');}
 if(a==='start'||a==='start-current'||a==='continue'||a==='realtime-start'||a==='quick-start'){state.playing=true;if(a==='quick-start'){state.duration=q('#at-quick-duration').value;state.language=q('#at-quick-language').value;state.record=q('#at-quick-record').checked;}if(a==='start')state.slide=0;return choose('playing');}
 if(a==='leave')return choose('resume');
 if(a==='pause'){state.playing=!state.playing;return render();}
 if(a==='next'||a==='previous'){state.slide=Math.min(7,Math.max(0,state.slide+(a==='next'?1:-1)));return render();}
 if(a==='preview'){state.previewAudio=!state.previewAudio;render();return toast('Audio preview controls shown; this design mockup does not synthesize sound.');}
 if(a==='save')return toast('Talk saved · preview only.');
 if(a==='mode-prepared'){state.mode='Prepared';return choose('prepared');}
 if(a==='mode-realtime')return choose('realtime');
 if(a==='prepare'){state.mode='Prepared';render();return toast('Preparation started: narration → audio → ready for review.');}
 if(a==='regenerate')return simple('Regenerate slide '+(state.slide+1),`${check('Rewrite narration',false)}${check('Regenerate speech',true)}${note('Uses the current talk settings and any deliberate slide overrides. Other slides are kept.')}`,btn('Cancel','close')+btn('Regenerate selected slide','regenerated',true));
 if(a==='regenerated'){render();return toast(`Slide ${state.slide+1} queued for regeneration.`);}
 if(a==='details')return simple('Preparation details',`<h3>Preparing slide 3 of 8</h3><table class="at-table"><tr><th>Stage</th><th>Status</th></tr><tr><td>Read PDF</td><td class="at-good">Complete · 8 slides</td></tr><tr><td>Write narration · Codex</td><td class="at-good">Complete · 8 slides</td></tr><tr><td>Create audio · Qwen3-TTS</td><td>2 ready · slide 3 in progress</td></tr></table><div class="at-progress"><span style="width:25%"></span></div>${note('Realtime begins once its initial audio is ready. Preparation continues ahead of playback.')}`,btn('Keep preparing','close')+btn('Cancel preparation','cancel-prep'));
 if(a==='cancel-prep'){choose('prepared');return toast('Preparation cancelled. Completed slides are retained.');}
 if(a==='end')return simple('End presentation?',`<p>The talk is at slide ${state.slide+1}, 03:24 elapsed.</p>${note(state.record?'Recording will be finalized and shown in Export & recordings.':'You can keep your position and continue later.')}`,btn('Keep presenting','close')+btn('Pause and return','leave')+btn('End presentation','ended',true));
 if(a==='ended'){choose('export');return toast('Presentation ended. Recording saved to the talk’s Recordings folder.');}
 if(a==='reference')return simple('Create a reference voice',`<h3>My voice · ${state.language}</h3><div class="at-inline">${btn('● Record sample','record-sample')}${btn('Import audio…','import-sample')}${btn('Microphone settings…','audio')}</div><p class="at-subtle">Record a short, clear passage in your normal presentation voice.</p><label class="at-field"><span>Exact transcript of this recording</span><textarea>Welcome. Today we will explore how local AI can help turn a slide deck into a presentation.</textarea></label>${check('I have permission to use this voice',true)}${note('Listen to the test result before accepting. The accepted audio and exact transcript are reused for every passage.')}`,btn('Cancel','close')+btn('Test voice','preview-voice')+btn('Accept & save voice','save-voice',true));
 if(a==='design-voice'){state.voiceSource='Designed voice';return modal('talk','voice');}
 if(a==='save-voice'||a==='use-voice'){close();return toast('Voice selected in this preview. Saved references are grouped by language.');}
 if(a==='record-sample'||a==='import-sample')return toast('Reference capture preview · 00:12 recorded. No microphone is accessed by this mockup.');
 if(a==='preview-voice')return toast('Voice audition preview. No audio is generated by this mockup.');
 if(a==='pdf-selected'){choose(state.mode==='Quick'?'quick':'prepared');return toast('Loaded local-ai-on-stage.pdf · 8 slides.');}
 if(a==='pdf-parent'||a==='pdf-folder')return toast('Native folder navigation preview. In the application this is the platform file dialog.');
 if(a==='open'||a==='recent')return simple('Open talk',`<h3>Recent talks</h3>${btn('Local AI on stage · English · 12 min','prepared')}${btn('Local AI on stage · German · 12 min','prepared')}<hr>${btn('Browse saved talks…','pdf')}`);
 if(a==='export-settings'||a==='export-audio')return simple(a==='export-audio'?'Export audio':'Export slide video',`${field('File name',a==='export-audio'?'Local AI on stage.wav':'Local AI on stage.mp4')}<div class="at-columns">${select('Quality',a==='export-audio'?['Native synthesis rate','48 kHz · resampled']:['1080p · 30 fps','720p · 30 fps'],a==='export-audio'?'Native synthesis rate':'1080p · 30 fps')}${select('Slides',['All 8 slides','Selected slide'],'All 8 slides')}</div>${note('Uses prepared slides and audio. A screen recording is captured live instead.')}`,btn('Cancel','close')+btn('Export','exported',true));
 if(a==='exported')return exportProgress();if(a==='capture-selected'){state.record=true;state.recordType='screen';return choose('presenter');}if(a==='setup-finished')return choose('quick');
 if(a==='read-context')return toast('Example scope loaded for review. This mockup does not access the website.');
 if(a==='inspector'){state.inspector=!state.inspector;root.dataset.inspector=String(state.inspector);return resize();}
 if(a==='navigator'){const el=q('.at-slides');if(el)el.hidden=!el.hidden;return toast('Slide navigator visibility toggled.');}
 if(a==='layout'){state.inspector=true;root.dataset.inspector='true';return render();}
 if(a==='diagnostics')return simple('Diagnostics',`<table class="at-table"><tr><th>Component</th><th>Example state</th></tr><tr><td>Codex connection</td><td>Connected</td></tr><tr><td>Qwen3-TTS 1.7B</td><td>Ready · NVIDIA GPU</td></tr><tr><td>Platform integration</td><td>Qt · Breeze · native dialogs</td></tr><tr><td>Recording destination</td><td>Talk folder / Recordings</td></tr></table>${btn('Copy diagnostic report','copy-report')}`);
 if(a==='shortcuts')return simple('Keyboard shortcuts',`<table class="at-table"><tr><th>Action</th><th>Shortcut</th></tr><tr><td>Start from beginning</td><td>F5</td></tr><tr><td>Start from selected slide</td><td>Shift+F5</td></tr><tr><td>Continue presentation</td><td>F6</td></tr><tr><td>Pause / resume in presenter view</td><td>Space</td></tr><tr><td>Leave fullscreen</td><td>Esc</td></tr><tr><td>Talk settings</td><td>Ctrl+T</td></tr></table>`);
 if(a==='help')return simple('Getting started',`<h3>From PDF to presentation</h3><p>1. Choose your slide deck, language, and talk length.</p><p>2. Choose Prepared, Quick, or Realtime.</p><p>3. Review the narration when your workflow calls for it.</p><p>4. Choose the presentation display and enable recording if needed.</p><p>5. Start. You can pause or leave fullscreen and continue later.</p>`);
 if(a==='about')return simple('About AutoTalk',`<h3>AutoTalk</h3><p>Turn a PDF slide deck into a spoken presentation.</p><p class="at-subtle">Desktop UI redesign proposal · example content and states</p>`);
 if(a==='find')return simple('Find in narration',`${field('Search for','local AI')}${btn('Find next','find-next')}`);
 if(a.startsWith('edit-')){q('#at-narration')?.focus();return toast('Narration editing action preview.');}
 if(a==='undo'||a==='redo')return toast('Narration history preview.');
 if(a==='quit')return simple('Close AutoTalk?',`<p>All changes to this example talk are saved.</p>`,btn('Cancel','close')+btn('Close preview dialog','close',true));
 if(a==='account')return simple('Codex account',`<span class="at-good">✓ Connected</span><p>Models and reasoning levels are provided by your Codex connection.</p>${btn('Manage connection…','manage-account')}`);
 if(a==='saveas')return simple('Save talk as',`${field('Talk name','Local AI on stage — copy')}${field('Location','Documents / AutoTalk')}`,btn('Cancel','close')+btn('Save','saved-copy',true));
 toast(({folder:'Output folder: Documents / AutoTalk / Local AI on stage / Recordings','record-folder':'Folder chooser preview: choose where AutoTalk saves its output.',fit:'Slide preview fitted to the available workspace.','play-recording':'Recording playback preview.','copy-report':'Diagnostic report copied in this preview.','saved-copy':'Copy saved in this preview.','find-next':'Next matching narration passage selected.','manage-account':'Codex connection settings preview.'})[a]||'Preview action selected.');
 }
 root.addEventListener('click',e=>{const menu=e.target.closest('[data-menu]');if(menu){state.menu=state.menu===menu.dataset.menu?'':menu.dataset.menu;menus();finishRender();return;}const sl=e.target.closest('[data-slide]');if(sl){state.slide=Number(sl.dataset.slide);render();return;}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action);return;}if(!e.target.closest('.at-menu-anchor')&&state.menu){state.menu='';menus();}});
 root.addEventListener('change',e=>{if(e.target.id==='at-scene')choose(e.target.value);if(e.target.id==='at-mode'){state.mode=e.target.value;choose(state.mode==='Quick'?'quick':state.mode==='Realtime'?'realtime':'prepared');}if(e.target.id==='at-record'){state.record=e.target.checked;q('#at-record-options').hidden=!state.record;resize();}if(e.target.name==='capture'){state.recordType=e.target.value;q('#at-capture-audio').innerHTML=select('Capture audio',state.recordType==='slides'?['AutoTalk narration']:['System audio','System audio + microphone'],state.recordType==='slides'?'AutoTalk narration':'System audio');}if(e.target.id==='at-voice-source'){state.voiceSource=e.target.value;q('#at-voice-fields').innerHTML=voiceFields();finishRender();}if(e.target.id==='at-inherit'){q('#at-delivery-summary').hidden=!e.target.checked;q('#at-local-delivery').hidden=e.target.checked;}if(e.target.name==='context-source'){q('#at-url-context').hidden=e.target.value==='text';resize();}if(e.target.id==='at-quick-record')state.record=e.target.checked;if(e.target.id==='at-library-language'){q('#at-modal').querySelectorAll('tbody tr').forEach(row=>{row.hidden=e.target.value!=='All languages'&&!['Multilingual',e.target.value].includes(row.lastElementChild.textContent);});}});
 root.addEventListener('input',e=>{if(e.target.id==='at-narration'){narration[state.slide]=e.target.value;q('#at-edit-status').textContent='Narration edited · regenerate audio before presenting';q('#at-status-left').textContent='Unsaved changes · slide '+(state.slide+1);}});
 root.addEventListener('keydown',e=>{if(e.key==='Escape'){state.menu='';menus();close();}});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.colorScheme=state.theme==='System'?'light dark':state.theme.toLowerCase();root.dataset.density=state.density;root.dataset.inspector=String(state.inspector);resize();}});tweak.addSelect(state,'theme',{label:'Platform appearance preview',options:['Light','Dark','System']});tweak.addSelect(state,'density',{label:'Control spacing',options:['compact','comfortable']});tweak.addToggle(state,'inspector',{label:'Persistent slide inspector'});}
})();
</script>
